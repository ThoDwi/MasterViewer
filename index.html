<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live & GPX Master Viewer</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background: #0f172a;
    }
    
    header {
      height: 55px;
      background: #0f172a; color: white; padding: 0 16px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      z-index: 1000; position: relative;
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    
    .live-btn {
      background: #334155; color: white; border: 1px solid #475569;
      padding: 6px 12px; border-radius: 6px; cursor: pointer;
      font-size: 12px; font-weight: 600; transition: all 0.2s;
    }
    .live-btn:hover { background: #475569; }
    .live-btn.active { background: #2563eb; border-color: #3b82f6; }
    .live-btn.offroad-active { background: #d97706; border-color: #f59e0b; color: #fff; }
    
    .file-btn {
      background: #0284c7; color: white; padding: 6px 12px;
      border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
    }
    .file-btn:hover { background: #0369a1; }
    input[type="file"] { display: none; }

    #map {
      width: 100vw;
      height: calc(100vh - 55px);
      background: #cbd5e1;
    }

    .leaflet-control-layers {
      border-radius: 8px !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3) !important;
      padding: 10px 12px !important;
      font-size: 13px !important;
      max-height: 75vh; overflow-y: auto;
      transition: all 0.3s ease;
    }
    .layer-action-btns {
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; padding-bottom: 8px;
      border-bottom: 1px solid #cbd5e1;
    }
    .layer-action-row { display: flex; gap: 6px; }
    .layer-action-btn {
      background: #f1f5f9; border: 1px solid #cbd5e1; color: #334155;
      padding: 5px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;
      cursor: pointer; flex: 1; text-align: center;
    }
    .layer-action-btn:hover { background: #0284c7; color: white; border-color: #0284c7; }

    .toggle-list-btn {
      background: #e2e8f0; color: #0f172a; font-weight: bold; border: 1px solid #94a3b8;
      padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; text-align: center;
      margin-bottom: 6px; display: block; width: 100%;
    }
    .toggle-list-btn:hover { background: #cbd5e1; }

    .layers-collapsed .leaflet-control-layers-overlays,
    .layers-collapsed .leaflet-control-layers-base,
    .layers-collapsed .leaflet-control-layers-separator,
    .layers-collapsed .layer-action-row {
      display: none !important;
    }
  </style>
</head>
<body>

<header>
  <h1>🗺️ Live & GPX Viewer</h1>
  
  <div class="btn-group">
    <button class="live-btn" id="btnFire">🔥 Live-Brände</button>
    <button class="live-btn" id="btnRain">🌧️ Regen-Radar</button>
    <button class="live-btn" id="btnBlocks">🚫 Sperrungen</button>
    <button class="live-btn" id="btnOffroad">🏕️ Offroad-Passagen</button>
  </div>

  <label class="file-btn">
    📂 GPX laden
    <input type="file" id="fileInput" accept=".gpx">
  </label>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  let map;
  let layerControl;
  let trackLayersMap = {};
  let trackPointsList = []; 
  let loadedTrackBounds = null; // Bounding Box für zielgerichtete Abfragen
  
  let fireLayer = null;
  let rainLayer = null;
  let blocksLayer = null;
  let offroadLayer = null;

  const colors = ['#2563eb', '#e11d48', '#16a34a', '#d97706', '#9333ea', '#0891b2', '#f59e0b', '#06b6d4'];

  function initMap() {
    map = L.map('map').setView([42.6, 1.5], 7);

    const osmTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    const satTile = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18, attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics'
    });

    const baseMaps = {
      "🗺️ Straßenkarte (OSM)": osmTile,
      "🛰️ Satellit (Esri)": satTile
    };

    layerControl = L.control.layers(baseMaps, {}, { collapsed: false }).addTo(map);
    setTimeout(() => { map.invalidateSize(); }, 200);
  }

  function addControlButtons() {
    const container = document.querySelector('.leaflet-control-layers');
    if (!container || document.getElementById('bulk-select-actions')) return;

    const actionDiv = document.createElement('div');
    actionDiv.id = 'bulk-select-actions';
    actionDiv.className = 'layer-action-btns';
    actionDiv.innerHTML = `
      <button class="toggle-list-btn" id="toggleListBtn">👁️ Liste einklappen (Hide)</button>
      <div class="layer-action-row">
        <button class="layer-action-btn" id="deselectAllBtn">Alle abwählen</button>
        <button class="layer-action-btn" id="selectAllBtn">Alle wählen</button>
      </div>
    `;

    const overlayContainer = container.querySelector('.leaflet-control-layers-overlays');
    if (overlayContainer) {
      container.insertBefore(actionDiv, container.firstChild);
    }

    let isCollapsed = false;
    document.getElementById('toggleListBtn').addEventListener('click', () => {
      isCollapsed = !isCollapsed;
      if (isCollapsed) {
        container.classList.add('layers-collapsed');
        document.getElementById('toggleListBtn').innerText = "👁️ Liste ausklappen (Show)";
      } else {
        container.classList.remove('layers-collapsed');
        document.getElementById('toggleListBtn').innerText = "👁️ Liste einklappen (Hide)";
      }
    });

    document.getElementById('deselectAllBtn').addEventListener('click', () => {
      const checkboxes = Array.from(container.querySelectorAll('input[type="checkbox"]'));
      checkboxes.forEach(cb => {
        if (cb.checked) { cb.checked = false; cb.dispatchEvent(new Event('click')); }
      });
    });

    document.getElementById('selectAllBtn').addEventListener('click', () => {
      const checkboxes = Array.from(container.querySelectorAll('input[type="checkbox"]'));
      checkboxes.forEach(cb => {
        if (!cb.checked) { cb.checked = true; cb.dispatchEvent(new Event('click')); }
      });
    });
  }

  function getDistanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function isPointOnTrack(lat, lon, maxMeters = 30) {
    if (trackPointsList.length === 0) return false;
    for (let i = 0; i < trackPointsList.length; i += 2) {
      if (getDistanceMeters(lat, lon, trackPointsList[i][0], trackPointsList[i][1]) <= maxMeters) return true;
    }
    return false;
  }

  async function fetchOverpassData(query) {
    const servers = [
      'https://overpass-api.de/api/interpreter',
      'https://overpass.kumi.systems/api/interpreter',
      'https://overpass.openstreetmap.fr/api/interpreter'
    ];
    for (const serverUrl of servers) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 12000);
        
        const res = await fetch(`${serverUrl}?data=${encodeURIComponent(query)}`, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) return await res.json();
      } catch (err) {
        console.log("Server Antwortverzögerung, wechsle Server...");
      }
    }
    return null;
  }

  // 1. LIVE-BRÄNDE
  async function toggleFireData() {
    const btn = document.getElementById('btnFire');
    if (fireLayer) {
      map.removeLayer(fireLayer); fireLayer = null;
      btn.classList.remove('active'); return;
    }
    btn.innerText = "⏳ Lade Brände...";
    try {
      const res = await fetch('https://eonet.gsfc.nasa.gov/api/v3/events?category=wildfires&status=open');
      const data = await res.json();
      fireLayer = L.layerGroup();
      let count = 0;
      data.events.forEach(event => {
        event.geometry.forEach(geo => {
          if (geo.type === "Point") {
            const marker = L.circleMarker([geo.coordinates[1], geo.coordinates[0]], {
              radius: 8, fillColor: "#dc2626", color: "#7f1d1d", weight: 2, fillOpacity: 0.85
            }).bindPopup(`<b>🔥 ${event.title}</b><br>Datum: ${new Date(geo.date).toLocaleDateString()}`);
            fireLayer.addLayer(marker); count++;
          }
        });
      });
      fireLayer.addTo(map);
      btn.classList.add('active'); btn.innerText = `🔥 Live-Brände (${count})`;
    } catch (e) {
      alert("Fehler beim Abrufen."); btn.innerText = "🔥 Live-Brände";
    }
  }

  // 2. REGEN-RADAR
  async function toggleRainRadar() {
    const btn = document.getElementById('btnRain');
    if (rainLayer) {
      map.removeLayer(rainLayer); rainLayer = null;
      btn.classList.remove('active'); return;
    }
    btn.innerText = "⏳ Lade Radar...";
    try {
      const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
      const data = await res.json();
      const latestPath = data.radar.past[data.radar.past.length - 1].path;
      rainLayer = L.tileLayer(`https://tilecache.rainviewer.com${latestPath}/256/{z}/{x}/{y}/2/1_1.png`, { opacity: 0.6, zIndex: 500 }).addTo(map);
      btn.classList.add('active'); btn.innerText = "🌧️ Regen-Radar (Aktiv)";
    } catch (e) {
      alert("Fehler beim Abrufen."); btn.innerText = "🌧️ Regen-Radar";
    }
  }

  // 3. SPERRUNGEN (Jetzt strikt auf GPX Bounding Box beschränkt!)
  async function toggleRouteBlocks() {
    const btn = document.getElementById('btnBlocks');
    if (blocksLayer) {
      map.removeLayer(blocksLayer); blocksLayer = null;
      btn.classList.remove('active'); btn.innerText = "🚫 Sperrungen"; return;
    }

    if (!loadedTrackBounds) {
      alert("Bitte lade zuerst eine GPX-Datei hoch.");
      return;
    }

    btn.innerText = "⏳ Prüfe Route...";
    const bbox = `${loadedTrackBounds.getSouth()},${loadedTrackBounds.getWest()},${loadedTrackBounds.getNorth()},${loadedTrackBounds.getEast()}`;
    
    const query = `[out:json][timeout:10];
      (
        way["highway"="construction"](${bbox});
        way["highway"="closed"](${bbox});
        way["access"="no"](${bbox});
      );
      out center;`;

    const data = await fetchOverpassData(query);
    if (!data) { alert("Sperrungsabfrage fehlgeschlagen."); btn.innerText = "🚫 Sperrungen"; return; }

    blocksLayer = L.layerGroup();
    let count = 0;

    data.elements.forEach(el => {
      const lat = el.lat || (el.center ? el.center.lat : null);
      const lon = el.lon || (el.center ? el.center.lon : null);
      if (lat && lon && isPointOnTrack(lat, lon, 40)) {
        const type = el.tags.highway || el.tags.access || "Sperrung";
        const name = el.tags.name ? `<b>${el.tags.name}</b><br>` : '';
        const marker = L.circleMarker([lat, lon], { radius: 8, fillColor: "#ea580c", color: "#9a3412", weight: 2, fillOpacity: 0.95 })
          .bindPopup(`<b>🚫 Sperrung auf Route</b><br>${name}Typ: ${type}`);
        blocksLayer.addLayer(marker); count++;
      }
    });

    blocksLayer.addTo(map);
    btn.classList.add('active'); 
    btn.innerText = `🚫 Sperrungen (${count})`;
  }

  // 4. OPTIMIERTE OFFROAD-SUCHE (Kein Crash, superschnell)
  async function toggleOffroadSections() {
    const btn = document.getElementById('btnOffroad');
    if (offroadLayer) {
      map.removeLayer(offroadLayer); offroadLayer = null;
      btn.classList.remove('offroad-active'); btn.innerText = "🏕️ Offroad-Passagen"; return;
    }

    if (!loadedTrackBounds || trackPointsList.length === 0) {
      alert("Bitte lade zuerst eine GPX-Datei hoch.");
      return;
    }

    btn.innerText = "⏳ Analysiere Track...";

    // Strikt auf den Bereich des geladenen GPX-Tracks begrenzen
    const bbox = `${loadedTrackBounds.getSouth()},${loadedTrackBounds.getWest()},${loadedTrackBounds.getNorth()},${loadedTrackBounds.getEast()}`;

    const query = `[out:json][timeout:15];
      (
        way["highway"="track"](${bbox});
        way["surface"~"unpaved|dirt|gravel|ground|grass|earth|compacted"](${bbox});
        way["tracktype"](${bbox});
      );
      out geometry;`;

    const data = await fetchOverpassData(query);

    if (!data || !data.elements) {
      alert("Die Abfrage hat zu lange gedauert. Der Bereich ist eventuell zu groß.");
      btn.innerText = "🏕️ Offroad-Passagen";
      return;
    }

    offroadLayer = L.layerGroup();
    let count = 0;

    data.elements.forEach(el => {
      if (el.type === "way" && el.geometry) {
        const coords = el.geometry.map(pt => [pt.lat, pt.lon]);
        
        // Prüfen ob die Passagenpunkte direkt auf unserer Route liegen (Filter)
        const isOnTrack = coords.some(c => isPointOnTrack(c[0], c[1], 35));
        
        if (isOnTrack) {
          const surface = el.tags.surface || el.tags.tracktype || el.tags.highway || "Offroad / Schotter";
          const polyline = L.polyline(coords, {
            color: '#facc15', // Neon Gelb
            weight: 7,
            opacity: 0.95
          }).bindPopup(`<b>🏕️ Offroad-Passage</b><br>Belag/Typ: ${surface}`);

          offroadLayer.addLayer(polyline);
          count++;
        }
      }
    });

    offroadLayer.addTo(map);
    btn.classList.add('offroad-active');
    btn.innerText = `🏕️ Offroad (${count} Abschnitte)`;

    if (count === 0) {
      alert("Keine registrierten Offroad-Abschnitte direkt auf deinem Track gefunden.");
    }
  }

  // PARSER FÜR FAHRTAGE UND WEGPUNKTE
  function parseGPXText(xmlString) {
    if (layerControl) map.removeControl(layerControl);
    Object.values(trackLayersMap).forEach(l => map.removeLayer(l));
    trackLayersMap = {}; 
    trackPointsList = [];

    const osmTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
    const satTile = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 });

    const baseMaps = { "🗺️ Straßenkarte (OSM)": osmTile, "🛰️ Satellit (Esri)": satTile };
    const overlayMaps = {}; 
    const allBounds = [];

    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlString, "text/xml");

    let tracks = Array.from(xmlDoc.getElementsByTagName("trk"));
    if (tracks.length === 0) tracks = Array.from(xmlDoc.getElementsByTagNameNS("*", "trk"));

    tracks.forEach((track, i) => {
      let nameEl = track.getElementsByTagName("name")[0] || track.getElementsByTagNameNS("*", "name")[0];
      const name = nameEl ? nameEl.textContent : `Tag ${i + 1}`;
      const color = colors[i % colors.length];

      let trkpts = Array.from(track.getElementsByTagName("trkpt"));
      if (trkpts.length === 0) trkpts = Array.from(track.getElementsByTagNameNS("*", "trkpt"));

      const coords = [];
      trkpts.forEach(pt => {
        const lat = parseFloat(pt.getAttribute("lat"));
        const lon = parseFloat(pt.getAttribute("lon"));
        if (!isNaN(lat) && !isNaN(lon)) {
          coords.push([lat, lon]);
          allBounds.push([lat, lon]);
          trackPointsList.push([lat, lon]);
        }
      });

      if (coords.length > 0) {
        const polyline = L.polyline(coords, { color: color, weight: 5, opacity: 0.9 }).addTo(map);
        polyline.bindPopup(`<b>📍 ${name}</b>`);
        const label = `<span style="color:${color}; font-weight:bold;">■</span> ${name}`;
        overlayMaps[label] = polyline;
        trackLayersMap['trk_' + i] = polyline;
      }
    });

    let waypoints = Array.from(xmlDoc.getElementsByTagName("wpt"));
    if (waypoints.length === 0) waypoints = Array.from(xmlDoc.getElementsByTagNameNS("*", "wpt"));

    waypoints.forEach((wpt, i) => {
      const lat = parseFloat(wpt.getAttribute("lat"));
      const lon = parseFloat(wpt.getAttribute("lon"));
      let nameEl = wpt.getElementsByTagName("name")[0] || wpt.getElementsByTagNameNS("*", "name")[0];
      let descEl = wpt.getElementsByTagName("desc")[0] || wpt.getElementsByTagNameNS("*", "desc")[0];
      
      const name = nameEl ? nameEl.textContent : `Wegpunkt ${i + 1}`;
      const desc = descEl ? descEl.textContent : '';

      if (!isNaN(lat) && !isNaN(lon)) {
        allBounds.push([lat, lon]);
        const circleMarker = L.circleMarker([lat, lon], {
          radius: 8, fillColor: "#dc2626", color: "#7f1d1d", weight: 2, fillOpacity: 0.9
        }).bindPopup(`<b>${name}</b><br>${desc}`);

        circleMarker.addTo(map);
        const label = `<span style="color:#dc2626; font-weight:bold;">🔴</span> ${name}`;
        overlayMaps[label] = circleMarker;
        trackLayersMap['wpt_' + i] = circleMarker;
      }
    });

    layerControl = L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);
    addControlButtons();

    if (allBounds.length > 0) { 
      loadedTrackBounds = L.latLngBounds(allBounds);
      map.fitBounds(loadedTrackBounds, { padding: [50, 50] }); 
    }
  }

  window.onload = function() {
    initMap();
    document.getElementById('btnFire').addEventListener('click', toggleFireData);
    document.getElementById('btnRain').addEventListener('click', toggleRainRadar);
    document.getElementById('btnBlocks').addEventListener('click', toggleRouteBlocks);
    document.getElementById('btnOffroad').addEventListener('click', toggleOffroadSections);

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => parseGPXText(e.target.result);
        reader.readAsText(file);
      }
    });
  };
</script>

</body>
</html>
