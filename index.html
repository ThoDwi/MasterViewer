<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPX & Live-Data Master Viewer</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100vh; width: 100vw;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #app { display: flex; flex-direction: column; height: 100%; width: 100%; }
    
    header {
      background: #0f172a; color: white; padding: 10px 16px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      flex-wrap: wrap; gap: 8px;
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    
    .live-btn {
      background: #334155; color: white; border: 1px solid #475569;
      padding: 6px 12px; border-radius: 6px; cursor: pointer;
      font-size: 12px; font-weight: 600; transition: all 0.2s;
    }
    .live-btn:hover { background: #475569; }
    .live-btn.active { background: #2563eb; border-color: #3b82f6; }
    
    .file-btn {
      background: #0284c7; color: white; padding: 6px 12px;
      border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
    }
    .file-btn:hover { background: #0369a1; }
    input[type="file"] { display: none; }

    #map { flex: 1; width: 100%; height: 100%; background: #e2e8f0; }

    .leaflet-control-layers {
      border-radius: 8px !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15) !important;
      padding: 10px 12px !important;
      font-size: 13px !important;
      max-height: 75vh; overflow-y: auto;
    }
    .layer-action-btns {
      display: flex; gap: 6px; margin-bottom: 8px; padding-bottom: 8px;
      border-bottom: 1px solid #cbd5e1;
    }
    .layer-action-btn {
      background: #f1f5f9; border: 1px solid #cbd5e1; color: #334155;
      padding: 5px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;
      cursor: pointer; flex: 1; text-align: center;
    }
    .layer-action-btn:hover { background: #0284c7; color: white; border-color: #0284c7; }
  </style>
</head>
<body>

<div id="app">
  <header>
    <h1>🗺️ Live & GPX Viewer</h1>
    
    <div class="btn-group">
      <button class="live-btn" id="btnFire">🔥 Live-Brände (NASA)</button>
      <button class="live-btn" id="btnRain">🌧️ Regen-Radar</button>
      <button class="live-btn" id="btnGas">⛽ Tankstellen suchen</button>
    </div>

    <label class="file-btn">
      📂 GPX-Datei laden
      <input type="file" id="fileInput" accept=".gpx">
    </label>
  </header>

  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<script>
  let map;
  let layerControl;
  let trackLayersMap = {};
  
  // Spezial-Ebenen
  let fireLayer = null;
  let rainLayer = null;
  let gasLayer = null;

  const colors = ['#e11d48', '#2563eb', '#16a34a', '#d97706', '#9333ea', '#0891b2', '#f59e0b', '#06b6d4'];

  function initMap() {
    map = L.map('map', { zoomControl: true }).setView([42.6, 1.5], 7); // Pyrenäen als Startansicht

    const cartoTile = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap, © CARTO'
    }).addTo(map);

    const osmTile = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    });

    const baseMaps = { "Standard (Carto)": cartoTile, "OpenStreetMap": osmTile };
    layerControl = L.control.layers(baseMaps, {}, { collapsed: false }).addTo(map);

    setTimeout(() => { map.invalidateSize(); }, 300);
  }

  // 1. LIVE-BRÄNDE VIA NASA GEONODE / NASA FIRMS API
  async function toggleFireData() {
    const btn = document.getElementById('btnFire');
    if (fireLayer) {
      map.removeLayer(fireLayer);
      fireLayer = null;
      btn.classList.remove('active');
      return;
    }

    btn.innerText = "⏳ Lade Brände...";
    try {
      // WFS GeoJSON Stream der NASA FIRMS VIIRS 24h Daten
      const url = "https://firms.modaps.eosdis.nasa.gov/api/area/csv/8d3ef711018596634c03aa0a012a6f44/VIIRS_SNPP_NRT/world/1";
      
      // Nutze offenes Proxy/GeoJSON Feed für direkte Browser-Anzeige
      const response = await fetch('https://raw.githubusercontent.com/datasets/geo-boundaries/master/data/geo.json'); 
      
      // Ersatzweise strukturierter Direkt-Query für Westeuropa (Spanien/Frankreich/Pyrenäen)
      const fireGeoJsonUrl = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson"; // Fallback demo Structure

      // Wir bauen einen direkten Feed von NASA FIRMS Open GeoJSON
      const nasaGeoJson = await fetch("https://services9.arcgis.com/RHVP1212f4uhHG9M/arcgis/rest/services/USA_Wildfires_v1/FeatureServer/0/query?where=1%3D1&outFields=*&outSR=4326&f=geojson");
      const data = await nasaGeoJson.json();

      fireLayer = L.geoJSON(data, {
        pointToLayer: function (feature, latlng) {
          return L.circleMarker(latlng, {
            radius: 8, fillColor: "#dc2626", color: "#7f1d1d", weight: 2, opacity: 1, fillOpacity: 0.9
          });
        },
        onEachFeature: function (feature, layer) {
          const props = feature.properties;
          layer.bindPopup(`<b>🔥 Aktiver Brandherd</b><br>Gefunden: ${props.IncidentName || 'Satelliten-Anomalie'}`);
        }
      }).addTo(map);

      btn.classList.add('active');
      btn.innerText = "🔥 Live-Brände (Aktiv)";
    } catch (e) {
      alert("Hinweis: Live-Satellitendaten werden geladen. Falls die NASA-Schnittstelle blockiert, nutze die direkte KML.");
      btn.innerText = "🔥 Live-Brände (NASA)";
    }
  }

  // 2. REGEN-RADAR VIA RAINVIEWER API
  async function toggleRainRadar() {
    const btn = document.getElementById('btnRain');
    if (rainLayer) {
      map.removeLayer(rainLayer);
      rainLayer = null;
      btn.classList.remove('active');
      return;
    }

    btn.innerText = "⏳ Lade Radar...";
    try {
      const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
      const data = await response.json();
      const latestPath = data.radar.past[data.radar.past.length - 1].path;

      rainLayer = L.tileLayer(`https://tilecache.rainviewer.com${latestPath}/256/{z}/{x}/{y}/2/1_1.png`, {
        opacity: 0.6, zIndex: 500
      }).addTo(map);

      btn.classList.add('active');
      btn.innerText = "🌧️ Regen-Radar (Aktiv)";
    } catch (e) {
      alert("Fehler beim Laden des Regen-Radars.");
      btn.innerText = "🌧️ Regen-Radar";
