<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live & GPX Viewer</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background: #0f172a;
    }
    
    header {
      height: 55px;
      background: #0f172a; color: white; padding: 0 16px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      z-index: 1000; position: relative;
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    
    .live-btn {
      background: #334155; color: white; border: 1px solid #475569;
      padding: 6px 12px; border-radius: 6px; cursor: pointer;
      font-size: 12px; font-weight: 600; transition: all 0.2s;
    }
    .live-btn:hover { background: #475569; }
    .live-btn.active { background: #2563eb; border-color: #3b82f6; }
    
    .file-btn {
      background: #0284c7; color: white; padding: 6px 12px;
      border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
    }
    .file-btn:hover { background: #0369a1; }
    input[type="file"] { display: none; }

    #map {
      width: 100vw;
      height: calc(100vh - 55px);
      background: #cbd5e1;
    }
  </style>
</head>
<body>

<header>
  <h1>🗺️ Live & GPX Viewer</h1>
  
  <div class="btn-group">
    <button class="live-btn" id="btnFire">🔥 Live-Brände (Pyrenäen/EU)</button>
    <button class="live-btn" id="btnRain">🌧️ Regen-Radar</button>
    <button class="live-btn" id="btnGas">⛽ Tankstellen</button>
  </div>

  <label class="file-btn">
    📂 GPX laden
    <input type="file" id="fileInput" accept=".gpx">
  </label>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  let map;
  let layerControl;
  let trackLayersMap = {};
  
  let fireLayer = null;
  let rainLayer = null;
  let gasLayer = null;

  const colors = ['#e11d48', '#2563eb', '#16a34a', '#d97706', '#9333ea', '#0891b2', '#f59e0b'];

  function initMap() {
    // Startkoordinaten: Pyrenäen
    map = L.map('map').setView([42.6, 1.5], 7);

    // Standard OpenStreetMap Tile Layer
    const osmTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const baseMaps = { "OpenStreetMap": osmTile };
    layerControl = L.control.layers(baseMaps, {}, { collapsed: false }).addTo(map);

    // Karten-Größe nach Laden abgleichen
    setTimeout(() => { map.invalidateSize(); }, 200);
  }

  // 1. LIVE-BRÄNDE
  async function toggleFireData() {
    const btn = document.getElementById('btnFire');
    if (fireLayer) {
      map.removeLayer(fireLayer);
      fireLayer = null;
      btn.classList.remove('active');
      return;
    }

    btn.innerText = "⏳ Lade Brände...";
    try {
      // USGS/EONET Live Fire Feed
      const res = await fetch('https://eonet.gsfc.nasa.gov/api/v3/events?category=wildfires');
      const data = await res.json();

      fireLayer = L.layerGroup();
      
      data.events.forEach(event => {
        event.geometry.forEach(geo => {
          if (geo.type === "Point") {
            const marker = L.circleMarker([geo.coordinates[1], geo.coordinates[0]], {
              radius: 9, fillColor: "#dc2626", color: "#7f1d1d", weight: 2, fillOpacity: 0.9
            }).bindPopup(`<b>🔥 ${event.title}</b><br>Datum: ${new Date(geo.date).toLocaleDateString()}`);
            fireLayer.addLayer(marker);
          }
        });
      });

      fireLayer.addTo(map);
      btn.classList.add('active');
      btn.innerText = "🔥 Live-Brände (Aktiv)";
    } catch (e) {
      alert("Fehler beim Abrufen der Live-Branddaten.");
      btn.innerText = "🔥 Live-Brände (Pyrenäen/EU)";
    }
  }

  // 2. REGEN-RADAR
  async function toggleRainRadar() {
    const btn = document.getElementById('btnRain');
    if (rainLayer) {
      map.removeLayer(rainLayer);
      rainLayer = null;
      btn.classList.remove('active');
      return;
    }

    btn.innerText = "⏳ Lade Radar...";
    try {
      const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
      const data = await res.json();
      const latestPath = data.radar.past[data.radar.past.length - 1].path;

      rainLayer = L.tileLayer(`https://tilecache.rainviewer.com${latestPath}/256/{z}/{x}/{y}/2/1_1.png`, {
        opacity: 0.6, zIndex: 500
      }).addTo(map);

      btn.classList.add('active');
      btn.innerText = "🌧️ Regen-Radar (Aktiv)";
    } catch (e) {
      alert("Fehler beim Abrufen des Niederschlagsradars.");
      btn.innerText = "🌧️ Regen-Radar";
    }
  }

  // 3. TANKSTELLEN
  async function fetchGasStations() {
    const btn = document.getElementById('btnGas');
    if (gasLayer) {
      map.removeLayer(gasLayer);
      gasLayer = null;
      btn.classList.remove('active');
      return;
    }

    btn.innerText = "⏳ Suche Tankstellen...";
    const bounds = map.getBounds();
    const bbox = `${bounds.getSouth()},${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()}`;
    const query = `[out:json];node["amenity"="fuel"](${bbox});out;`;
    const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;

    try {
      const res = await fetch(url);
      const data = await res.json();

      gasLayer = L.layerGroup();
      data.elements.forEach(node => {
        const marker = L.circleMarker([node.lat, node.lon], {
          radius: 6, fillColor: "#059669", color: "#065f46", weight: 2, fillOpacity: 0.9
        }).bindPopup(`<b>⛽ ${node.tags.name || 'Tankstelle'}</b><br>${node.tags.operator || ''}`);
        gasLayer.addLayer(marker);
      });

      gasLayer.addTo(map);
      btn.classList.add('active');
      btn.innerText = `⛽ Tankstellen (${data.elements.length})`;
    } catch (e) {
      alert("Fehler beim Suchen der Tankstellen.");
      btn.innerText = "⛽ Tankstellen";
    }
  }

  // GPX DATEIEN PARSEN
  function parseGPXText(xmlString) {
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlString, "text/xml");

    let tracks = Array.from(xmlDoc.getElementsByTagName("trk"));
    if (tracks.length === 0) tracks = Array.from(xmlDoc.getElementsByTagNameNS("*", "trk"));

    const allBounds = [];

    tracks.forEach((track, i) => {
      let nameEl = track.getElementsByTagName("name")[0] || track.getElementsByTagNameNS("*", "name")[0];
      const name = nameEl ? nameEl.textContent : `Track ${i + 1}`;
      const color = colors[i % colors.length];

      let trkpts = Array.from(track.getElementsByTagName("trkpt"));
      if (trkpts.length === 0) trkpts = Array.from(track.getElementsByTagNameNS("*", "trkpt"));

      const coords = [];
      trkpts.forEach(pt => {
        const lat = parseFloat(pt.getAttribute("lat"));
        const lon = parseFloat(pt.getAttribute("lon"));
        if (!isNaN(lat) && !isNaN(lon)) {
          coords.push([lat, lon]);
          allBounds.push([lat, lon]);
        }
      });

      if (coords.length > 0) {
        const polyline = L.polyline(coords, { color: color, weight: 5, opacity: 0.9 }).addTo(map);
        polyline.bindPopup(`<b><sup>📍</sup> ${name}</b>`);
      }
    });

    if (allBounds.length > 0) map.fitBounds(allBounds, { padding: [50, 50] });
  }

  window.onload = function() {
    initMap();

    document.getElementById('btnFire').addEventListener('click', toggleFireData);
    document.getElementById('btnRain').addEventListener('click', toggleRainRadar);
    document.getElementById('btnGas').addEventListener('click', fetchGasStations);

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => parseGPXText(e.target.result);
        reader.readAsText(file);
      }
    });
  };
</script>

</body>
</html>
